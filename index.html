<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f6f6a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Bookmark Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one centered column, a "spine" card for the book, big thumb-sized transport below */
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;
  --bg:#f3f0ea; --surface:#fffdf8; --ink:#1f2a2e; --muted:#6a7378; --line:#ddd7cc;
  --accent:#2f6f6a; --accent-ink:#ffffff; --track:#d9d3c7;
  --display:"Fraunces", Georgia, serif;
  --body:"Figtree", system-ui, -apple-system, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151a1c; --surface:#1e2427; --ink:#ece8df; --muted:#9aa3a6; --line:#2e3639;
  --accent:#6fbdb4; --accent-ink:#10201e; --track:#333d40; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151a1c; --surface:#1e2427; --ink:#ece8df; --muted:#9aa3a6; --line:#2e3639;
  --accent:#6fbdb4; --accent-ink:#10201e; --track:#333d40; color-scheme:dark}
html,body{height:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));padding-block:20px}
.wrap{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:700;font-size:1.5rem;margin:0;text-wrap:balance}
.kicker{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.book{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:18px}
.cover{display:flex;gap:14px;align-items:center;min-width:0}
.spine{flex:none;width:56px;height:76px;border-radius:4px 8px 8px 4px;background:var(--accent);
  box-shadow:inset 6px 0 0 rgba(0,0,0,.18);display:grid;place-items:center;color:var(--accent-ink);font-family:var(--display);font-size:1.4rem}
.meta{min-width:0}
.title{font-family:var(--display);font-weight:500;font-size:1.15rem;line-height:1.25;overflow-wrap:anywhere}
.sub{color:var(--muted);font-size:.85rem;margin-top:4px}
.seek{display:flex;flex-direction:column;gap:6px}
input[type=range]{width:100%;margin:0;-webkit-appearance:none;appearance:none;background:transparent;height:28px}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(to right,var(--accent) var(--p,0%),var(--track) var(--p,0%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--accent);margin-top:-7px;border:3px solid var(--surface)}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:var(--track)}
input[type=range]::-moz-range-progress{height:6px;border-radius:3px;background:var(--accent)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--accent);border:3px solid var(--surface)}
.times{display:flex;justify-content:space-between;font-family:var(--mono);font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.controls{display:flex;align-items:center;justify-content:center;gap:22px}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
button:focus-visible,label.pick:focus-within{outline:3px solid var(--accent);outline-offset:3px}
.skip{width:58px;height:58px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;position:relative}
.skip span{position:absolute;font-family:var(--mono);font-size:.68rem;font-weight:500}
.skip svg{width:30px;height:30px;stroke:var(--ink);fill:none;stroke-width:1.8}
.play{width:78px;height:78px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.play svg{width:32px;height:32px;fill:var(--accent-ink)}
button:disabled{opacity:.4;cursor:default}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.speed{border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-family:var(--mono);font-size:.85rem}
.saved{font-size:.8rem;color:var(--muted)}
label.pick{display:flex;align-items:center;justify-content:center;gap:10px;padding:14px;border:1.5px dashed var(--line);border-radius:14px;cursor:pointer;font-weight:600;background:var(--surface)}
label.pick input{position:absolute;opacity:0;width:1px;height:1px}
.note{font-size:.82rem;color:var(--muted);line-height:1.5;margin:0}
.err{color:#b2442f;font-size:.88rem;margin:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>Bookmark Player</h1>
    <span class="kicker">.m4b · .mp3 · .m4a</span>
  </header>

  <section class="book" aria-label="Now playing">
    <div class="cover">
      <div class="spine" id="spine" aria-hidden="true">♪</div>
      <div class="meta">
        <div class="title" id="title">No book loaded yet</div>
        <div class="sub" id="sub">Tap “Open audiobook” below to choose the file.</div>
      </div>
    </div>

    <div class="seek">
      <input type="range" id="bar" min="0" max="1000" value="0" step="1" aria-label="Position in book" disabled>
      <div class="times"><span id="cur">0:00:00</span><span id="left">-0:00:00</span></div>
    </div>

    <div class="controls">
      <button class="skip" id="back" aria-label="Back 15 seconds" disabled>
        <svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 3v4h4"/></svg><span>15</span>
      </button>
      <button class="play" id="play" aria-label="Play" disabled>
        <svg id="icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button class="skip" id="fwd" aria-label="Forward 30 seconds" disabled>
        <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 3v4h-4"/></svg><span>30</span>
      </button>
    </div>

    <div class="row">
      <button class="speed" id="speed" aria-label="Playback speed">1.0×</button>
      <span class="saved" id="saved">Spot saves automatically</span>
    </div>
  </section>

  <label class="pick">
    <input type="file" id="file" accept=".m4b,.m4a,.mp3,.aac,audio/*">
    <span id="pickText">Open audiobook</span>
  </label>
  <p class="err" id="err" hidden></p>
  <p class="note">Your place is remembered on this phone. Next time, open the same file and it picks up right where you stopped.</p>

  <audio id="audio" preload="metadata"></audio>
</div>

<script>
(function(){
  const $=id=>document.getElementById(id);
  const a=$('audio'),bar=$('bar'),play=$('play'),icon=$('icon'),back=$('back'),fwd=$('fwd'),speed=$('speed');
  const speeds=[1,1.25,1.5,1.75,2,0.75];let si=0;
  let key=null,url=null,dragging=false,lastSave=0;

  const store={
    get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},
    set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}
  };
  const fmt=s=>{if(!isFinite(s)||s<0)s=0;s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h+':'+String(m).padStart(2,'0')+':'+String(x).padStart(2,'0')};
  const PLAY='<path d="M8 5v14l11-7z"/>',PAUSE='<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>';

  function save(force){
    if(!key||!isFinite(a.duration))return;
    const now=Date.now(); if(!force&&now-lastSave<3000)return; lastSave=now;
    if(store.set(key,{t:a.currentTime,rate:a.playbackRate,at:now})){
      $('saved').textContent='Saved at '+fmt(a.currentTime);
    }
  }
  function paint(){
    const d=a.duration||0,t=a.currentTime||0;
    if(!dragging){bar.value=d?Math.round(t/d*1000):0}
    bar.style.setProperty('--p',(bar.value/10)+'%');
    $('cur').textContent=fmt(dragging?bar.value/1000*d:t);
    $('left').textContent='-'+fmt(d-(dragging?bar.value/1000*d:t));
  }
  function setIcon(){const p=!a.paused;icon.innerHTML=p?PAUSE:PLAY;play.setAttribute('aria-label',p?'Pause':'Play')}

  $('file').addEventListener('change',e=>{
    const f=e.target.files&&e.target.files[0]; if(!f)return;
    $('err').hidden=true;
    if(url)URL.revokeObjectURL(url);
    url=URL.createObjectURL(f);
    key='pos:'+f.name+':'+f.size;
    const name=f.name.replace(/\.[^.]+$/,'');
    $('title').textContent=name;
    $('spine').textContent=(name.trim()[0]||'♪').toUpperCase();
    $('sub').textContent='Loading…';
    $('pickText').textContent='Open a different file';
    a.src=url;a.load();
  });

  a.addEventListener('loadedmetadata',()=>{
    const s=store.get(key);
    if(s&&s.t>0&&s.t<a.duration-2){a.currentTime=s.t;$('sub').textContent='Resuming at '+fmt(s.t)+' of '+fmt(a.duration)}
    else $('sub').textContent='Length '+fmt(a.duration);
    if(s&&s.rate){si=Math.max(0,speeds.indexOf(s.rate));a.playbackRate=speeds[si];speed.textContent=speeds[si].toFixed(2).replace(/0$/,'')+'×'}
    [bar,play,back,fwd].forEach(el=>el.disabled=false);
    paint();
    if('mediaSession' in navigator){
      try{
        navigator.mediaSession.metadata=new MediaMetadata({title:$('title').textContent,artist:'Audiobook'});
        navigator.mediaSession.setActionHandler('play',()=>a.play());
        navigator.mediaSession.setActionHandler('pause',()=>a.pause());
        navigator.mediaSession.setActionHandler('seekbackward',()=>skip(-15));
        navigator.mediaSession.setActionHandler('seekforward',()=>skip(30));
      }catch(e){}
    }
  });
  a.addEventListener('error',()=>{
    $('err').hidden=false;
    $('err').textContent='This phone’s browser couldn’t play that file. Try opening this page in Safari (iPhone) or Chrome (Android).';
    $('sub').textContent='Couldn’t load the file';
  });
  a.addEventListener('timeupdate',()=>{paint();save(false)});
  a.addEventListener('play',setIcon);
  a.addEventListener('pause',()=>{setIcon();save(true)});
  a.addEventListener('ended',()=>{setIcon();save(true)});

  function skip(n){a.currentTime=Math.min(Math.max(0,a.currentTime+n),a.duration||0);paint();save(true)}
  play.addEventListener('click',()=>{a.paused?a.play().catch(()=>{}):a.pause()});
  back.addEventListener('click',()=>skip(-15));
  fwd.addEventListener('click',()=>skip(30));
  speed.addEventListener('click',()=>{si=(si+1)%speeds.length;a.playbackRate=speeds[si];speed.textContent=speeds[si].toFixed(2).replace(/0$/,'')+'×';save(true)});

  bar.addEventListener('input',()=>{dragging=true;paint()});
  bar.addEventListener('change',()=>{dragging=false;if(a.duration){a.currentTime=bar.value/1000*a.duration}paint();save(true)});

  document.addEventListener('visibilitychange',()=>{if(document.hidden)save(true)});
  window.addEventListener('pagehide',()=>save(true));
  paint();
})();
</script>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}</script>
</body>
</html>
